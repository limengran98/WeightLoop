[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightloop"
version = "0.1.1"
description = "Weight-space programming with experimental feedback"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3"]
authors = [{name = "Anonymous Authors"}]

[project.optional-dependencies]
scientific = ["scipy>=1.10,<2"]


[tool.setuptools.packages.find]
include = ["weightloop*"]

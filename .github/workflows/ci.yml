name: Check release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numpy-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/feedback_demo.py --output outputs/ci-demo
      - run: python scripts/reproduce_tables.py
      - run: python scripts/check_release.py --links
      - run: python scripts/update_public_assets.py --check
